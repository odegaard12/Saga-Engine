name: Lint Code Base

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      # Sin banderas: la que seleccionaba extensiones ya no existe desde
      # eslint 9, y qué ficheros se miran lo decide `files` en eslint.config.js.
      - name: Run ESLint
        working-directory: ./frontend
        run: npx eslint src

      # - name: Run Prettier check
      #   working-directory: ./frontend
      #   run: npx prettier --check src
