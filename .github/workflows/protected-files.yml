name: Protected files guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Check protected files
        run: python scripts/check_protected_files.py --base "origin/${GITHUB_BASE_REF:-main}"
