name: Publish release

# Crea la entrada de Release en GitHub a partir de un tag.
#
# Hasta ahora los tags se subían a mano y las Releases se escribían una a una,
# así que la página quedaba desordenada y con versiones sin publicar. Aquí lo
# hace Actions con su propio GITHUB_TOKEN: no hace falta ningún secreto extra.
#
#  - push de un tag vX.Y.Z  -> publica esa release
#  - ejecución manual       -> publica las que falten (backfill)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Publicar todos los tags que aún no tengan release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publicar release del tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe."
            exit 0
          fi

          # El cuerpo del commit del tag es la nota de la release.
          TITLE="$(git tag -l --format='%(contents:subject)' "$TAG")"
          if [ -z "$TITLE" ]; then
            TITLE="$(git log -1 --format=%s "$TAG")"
          fi

          git log -1 --format=%B "$TAG" > /tmp/notas.md

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file /tmp/notas.md \
            --verify-tag

      - name: Publicar las releases que falten
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          creadas=0
          existentes=0
          saltadas=0

          # Orden por versión para que la lista quede ordenada de verdad.
          for TAG in $(git tag -l 'v*' --sort=version:refname); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              existentes=$((existentes + 1))
              continue
            fi

            # Un tag que apunte a un commit inexistente no se puede publicar.
            if ! git rev-parse -q --verify "${TAG}^{commit}" >/dev/null; then
              echo "SALTADO $TAG (apunta a un commit que ya no existe)"
              saltadas=$((saltadas + 1))
              continue
            fi

            TITLE="$(git log -1 --format=%s "$TAG")"
            git log -1 --format=%B "$TAG" > /tmp/notas.md

            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file /tmp/notas.md \
              --verify-tag

            echo "PUBLICADA $TAG"
            creadas=$((creadas + 1))
          done

          echo
          echo "creadas: $creadas   ya existían: $existentes   saltadas: $saltadas"
