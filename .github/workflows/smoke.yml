name: Smoke Check

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn jinja2 python-multipart

      - name: Start app
        env:
          ADMIN_PASS: test_admin_password
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8097 >/tmp/saga_smoke.log 2>&1 &
          sleep 4

      - name: Smoke endpoints
        run: |
          curl -fsS http://127.0.0.1:8097/
          curl -fsS http://127.0.0.1:8097/admin
          curl -fsS http://127.0.0.1:8097/api/config
