name: Smoke Check

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn jinja2 python-multipart

      - name: Create React dist fixture for backend smoke
        run: |
          mkdir -p frontend/dist/assets
          cat > frontend/dist/index.html <<'HTML'
          <!doctype html>
          <html>
            <head>
              <meta charset="UTF-8" />
              <title>SAGA Smoke React Fixture</title>
            </head>
            <body>
              <div id="root">SAGA smoke fixture</div>
            </body>
          </html>
          HTML

      - name: Validate Python syntax
        run: |
          python -m py_compile main.py

      - name: Start app
        env:
          ADMIN_PASS: test_admin_password
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8097 >/tmp/saga_smoke.log 2>&1 &
          sleep 4
          curl -fsS http://127.0.0.1:8097/docs >/dev/null || (cat /tmp/saga_smoke.log && exit 1)

      - name: Smoke endpoints
        run: |
          curl -fsS http://127.0.0.1:8097/ >/dev/null
          curl -fsSI http://127.0.0.1:8097/ >/dev/null
          curl -fsS http://127.0.0.1:8097/player/PLAYER%201 >/dev/null
          curl -fsSI http://127.0.0.1:8097/player/PLAYER%201 >/dev/null
          curl -fsS http://127.0.0.1:8097/admin >/dev/null
          curl -fsSI http://127.0.0.1:8097/admin >/dev/null
          curl -fsS http://127.0.0.1:8097/api/config >/dev/null
          curl -fsS http://127.0.0.1:8097/api/game/PLAYER%201 >/dev/null
