name: Privacy audit guard

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-audit-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${GITHUB_BASE_REF:-main}:refs/remotes/origin/${GITHUB_BASE_REF:-main}"

      - name: Run audit guards
        run: python scripts/check_audit_guards.py --base "origin/${GITHUB_BASE_REF:-main}"
