version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-runtime:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # Fijado en 6.10.0 (5.56.1): con 6.13 el fondo del mapa salía borroso en el iPhone. Subirlo sólo a mano, probándolo en un iPhone.
      - dependency-name: "maplibre-gl"
      # eslint-plugin-react 7.37.5 (la última) solo admite eslint hasta 9: con
      # eslint 10 npm da ERESOLVE. Quitar cuando el plugin lo soporte.
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0"
    groups:
      react-major:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      typescript:
        patterns:
          - "typescript"
      frontend-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "eslint*"
          - "@typescript-eslint/*"
      frontend-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "typescript"
          - "vite"
          - "@vitejs/*"
          - "eslint*"
          - "@typescript-eslint/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
