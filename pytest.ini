[pytest]
testpaths = tests
markers =
    slow: pruebas de mas de ~3 s (banco de simulacion, fuerza bruta). Fuera de la ejecucion por defecto; `pytest -m ""` las incluye.
# Por defecto: solo lo rapido y en paralelo. Todo: `python -m pytest -q -m ""`.
# Sin paralelo (depurar): `-n0`.
addopts = -m "not slow" -n auto
