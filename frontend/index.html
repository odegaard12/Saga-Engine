    <!-- 23/11 («5 s en blanco al abrir»): el fondo de la portada ya en la cabecera, antes de que baje la hoja de estilos
         (que bloquea el primer pintado): sin esto, hasta que llega, el navegador pinta blanco. Mismo color que la portada. -->
    <style>html,body{margin:0;background:#020617}</style>
    <!-- 23/11: con un jugador recordado, la comprobación de sesión (la de la entrada directa, ver jugadorRecordado.ts) sale ya,
         en paralelo a la descarga del código. Misma regla que `entradaDirectaPosible`. -->
    <script>try{var u=localStorage.getItem('saga_remembered_player'),p=location.pathname;if(u&&(p==='/'||p==='/player'||p==='/player/')&&!/[?&](pin|cambiar)(=|&|$)/.test(location.search)){window.__sagaSesionUser=u;window.__sagaSesion=fetch('/api/jugador/sesion?user='+encodeURIComponent(u),{cache:'no-store',headers:{Accept:'application/json'}}).then(function(r){return r.ok?'valida':r.status===401||r.status===403||r.status===404?'invalida':'sin-red'},function(){return'sin-red'})}}catch(e){}</script>

  <body>
    <!-- 20/11 (QA): con red muy lenta la primera apertura era ~45 s de fondo liso mientras bajaba el código. Esta portada
         mínima se ve al instante (va dentro de la página) y React la sustituye al arrancar.
         20/11: React pinta la MISMA portada (PortadaDeArranque, en shared/PuertaDeMision.tsx) y la funde al decidir qué
         toca: si se cambia aquí, cambiarla allí. -->
    <div id="root"><div style="position:fixed;inset:0;display:grid;place-items:center;background:var(--theme-bg,#020617);color:#fff;font-family:system-ui,sans-serif"><div style="text-align:center"><div style="font-weight:900;letter-spacing:.18em;font-size:40px;padding-left:.18em">SAGA</div><div style="width:180px;height:5px;border-radius:3px;background:rgba(255,255,255,.15);margin:18px auto 0;overflow:hidden"><div style="width:38%;height:100%;border-radius:3px;background:#38bdf8;animation:sagaArranque 1.4s ease-in-out infinite"></div></div></div><style>@keyframes sagaArranque{0%{transform:translateX(-100%)}100%{transform:translateX(280%)}}</style></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
